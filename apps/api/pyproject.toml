[project]
name = "threshold-api"
version = "0.1.0"
description = "The API behind the world."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "redis>=8.1",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
